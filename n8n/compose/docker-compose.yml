name: ai-workflow-sandbox

networks:
  sandbox-net: {}

volumes:
  sandbox_pgdata: {}
  sandbox_n8n_data: {}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [sandbox-net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - sandbox_pgdata:/var/lib/postgresql/data
      - ../docker/sandbox/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    build:
      context: ../docker
      dockerfile: n8n-main/Dockerfile
      args:
        N8N_VERSION: ${N8N_VERSION}
    restart: unless-stopped
    networks: [sandbox-net]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- core ---
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_HOST: ${SANDBOX_HOST:-n8n.local}
      WEBHOOK_URL: https://${SANDBOX_HOST:-n8n.local}:5678/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      NODE_ENV: development
      N8N_LOG_FORMAT: json
      # --- execution mode: single-process, no queue/Redis for a laptop sandbox ---
      EXECUTIONS_MODE: regular
      # --- database ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_SSL_ENABLED: "false"
      # --- encryption / runner auth (one shared secret) ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_ENCRYPTION_KEY}
      # --- external task runners ---
      # Compose gives every service its own network namespace, so the broker must bind on
      # 0.0.0.0 here and the runner (below) must dial the `n8n` service name instead of
      # localhost. n8n's broker binds using N8N_RUNNERS_BROKER_LISTEN_ADDRESS, which
      # defaults to 127.0.0.1 regardless of the URI value — without it set explicitly the
      # runner's "Waiting for task broker to be ready" never resolves and every Code node
      # times out after 60s.
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_TASK_BROKER_URI: http://0.0.0.0:5679
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # --- posture flags ---
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      # NODES_EXCLUDE / N8N_RUNNER_DENYLIST deliberately unset — docker/shared/n8n-entrypoint.sh
      # has a clean fallback path that boots on n8n's own defaults and logs a NOTICE.
      # --- host Claude bridge (see n8n/host-bridge/) ---
      CLAUDE_BRIDGE_URL: ${CLAUDE_BRIDGE_URL:-http://host.docker.internal:8787}
      CLAUDE_BRIDGE_TOKEN: ${CLAUDE_BRIDGE_TOKEN:-}
      # --- Optional integration secrets (read in node EXPRESSIONS via $env) ---
      # Every var is opt-in: if unset in .env.sandbox it arrives as an empty string.
      # Add or remove entries here as your workflows need them.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      EXAMPLE_API_TOKEN: ${EXAMPLE_API_TOKEN:-}
      EXAMPLE_API_BASE_URL: ${EXAMPLE_API_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sandbox_n8n_data:/home/node/.n8n
    # port 5678 is reachable only on sandbox-net (as `n8n:5678`) — caddy is the sole
    # container publishing a host port, so this is deliberately NOT a `ports:` entry.

  n8n-runner:
    build:
      context: ../docker
      dockerfile: n8n-runner/Dockerfile
      args:
        N8N_VERSION: ${N8N_VERSION}
    restart: unless-stopped
    networks: [sandbox-net]
    depends_on:
      - n8n
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      # N8N_RUNNER_DENYLIST deliberately unset — see docker/n8n-runner/entrypoint.sh's
      # own fallback path.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks: [sandbox-net]
    depends_on:
      - n8n
    environment:
      SANDBOX_HOST: ${SANDBOX_HOST:-n8n.local}
    ports:
      - "5678:5678"
    volumes:
      - ../docker/sandbox/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
